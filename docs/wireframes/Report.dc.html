<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>PDF レポート</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;color:#1f2328}
a{color:#1d4ed8}a:hover{color:#1e3a8a}
button,input,textarea{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 1030px; box-sizing: border-box; background: #f4f5f7; display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 8px; padding: 12px 8px 10px; background: #ffffff; border-bottom: 1px solid #d9dce1">
    <a href="TeamSettings.dc.html" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; text-decoration: none" aria-label="戻る">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1f2328" stroke-width="2" aria-hidden="true"><path d="M15 19l-7-7 7-7"/></svg>
    </a>
    <div style="display: flex; flex-direction: column; gap: 2px; flex: 1">
      <span style="font-size: 16px; font-weight: 600">PDF レポート</span>
      <span style="font-size: 12px; color: #5b6472">支援会議・個別支援計画・行政への提出用</span>
    </div>
  </div>
  <div style="flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding: 10px 16px">
    <section style="background: #ffffff; border: 1px solid #c7cbd1; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 600; color: #5b6472">期間</span>
      <div style="display: flex; flex-wrap: wrap; gap: 6px"><button style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #c7cbd1; background: #ffffff; color: #3b4452; font-size: 13px">直近4週間</button><button style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 2px solid #1d4ed8; background: #e8eefc; color: #1e40af; font-size: 13px; font-weight: 600">前回の会議から</button><button style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #c7cbd1; background: #ffffff; color: #3b4452; font-size: 13px">3か月</button><button style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #c7cbd1; background: #ffffff; color: #3b4452; font-size: 13px">期間を選ぶ</button></div>
      <span style="font-size: 12px; color: #3b4452">10/8（水）〜 11/4（火）</span>
    </section>
    <section style="background: #ffffff; border: 1px solid #c7cbd1; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 600; color: #5b6472">入れるもの</span>
      <div style="display: flex; align-items: center; gap: 10px; min-height: 36px; font-size: 13px"><span style="width: 22px; height: 22px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; box-sizing: border-box; flex-shrink: 0; background: #1d4ed8; border: 2px solid #1d4ed8; color: #ffffff">✓</span><span>グラフ（行動ごと、条件変更の線と目標の線つき）</span></div>
      <div style="display: flex; align-items: center; gap: 10px; min-height: 36px; font-size: 13px"><span style="width: 22px; height: 22px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; box-sizing: border-box; flex-shrink: 0; background: #1d4ed8; border: 2px solid #1d4ed8; color: #ffffff">✓</span><span>ABC の集計（きっかけ・結果・場面の多い順）</span></div>
      <div style="display: flex; align-items: center; gap: 10px; min-height: 36px; font-size: 13px"><span style="width: 22px; height: 22px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; box-sizing: border-box; flex-shrink: 0; background: #1d4ed8; border: 2px solid #1d4ed8; color: #ffffff">✓</span><span>支援計画と達成状況</span></div>
      <div style="display: flex; align-items: center; gap: 10px; min-height: 36px; font-size: 13px"><span style="width: 22px; height: 22px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; box-sizing: border-box; flex-shrink: 0; background: #1d4ed8; border: 2px solid #1d4ed8; color: #ffffff">✓</span><span>できたこと</span></div>
      <div style="display: flex; align-items: center; gap: 10px; min-height: 36px; font-size: 13px"><span style="width: 22px; height: 22px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; box-sizing: border-box; flex-shrink: 0; background: #ffffff; border: 2px solid #8a94a3; color: #ffffff"></span><span>時間帯の図</span></div>
      <div style="display: flex; align-items: center; gap: 10px; min-height: 36px; font-size: 13px"><span style="width: 22px; height: 22px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; box-sizing: border-box; flex-shrink: 0; background: #ffffff; border: 2px solid #8a94a3; color: #ffffff"></span><span>睡眠</span></div>
      <div style="display: flex; align-items: center; gap: 10px; min-height: 36px; font-size: 13px"><span style="width: 22px; height: 22px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; box-sizing: border-box; flex-shrink: 0; background: #ffffff; border: 2px solid #8a94a3; color: #ffffff"></span><span>身体拘束の記録（回数と内容）</span></div>
      <span style="font-size: 12px; color: #5b6472; line-height: 1.5">写真と住所は入りません。名前は呼び名（例: Aさん）のままです。</span>
    </section>
    <section style="background: #ffffff; border: 1px solid #c7cbd1; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 600; color: #5b6472">見本</span>
      <div style="height: 150px; border: 1px solid #d9dce1; border-radius: 6px; background: #ffffff; padding: 10px; display: flex; flex-direction: column; gap: 6px">
        <div style="height: 10px; width: 60%; background: #1f2328; border-radius: 2px"></div>
        <div style="height: 6px; width: 40%; background: #c7cbd1; border-radius: 2px"></div>
        <div style="flex: 1; border: 1px dashed #c7cbd1; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #8a94a3">グラフ</div>
        <div style="height: 6px; width: 80%; background: #e5e7eb; border-radius: 2px"></div>
        <div style="height: 6px; width: 70%; background: #e5e7eb; border-radius: 2px"></div>
      </div>
      <span style="font-size: 12px; color: #3b4452">A4 縦 ・ 4ページ ・ 白黒で印刷しても線の区別がつきます</span>
    </section>
  </div>
  <div style="display: flex; flex-direction: column; gap: 6px; padding: 10px 16px 16px; background: #ffffff; border-top: 1px solid #d9dce1">
      <button style="min-height: 48px; border-radius: 10px; border: none; background: #1d4ed8; color: #ffffff; font-size: 15px; font-weight: 600">PDF を作る</button>
      <span style="font-size: 12px; color: #5b6472; line-height: 1.5">作れるのは管理者・副管理者・支援リーダー（CSV と同じ）。作ると管理者にメールが届きます。</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1030}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
