<div style="width: 390px; height: 1020px; box-sizing: border-box; background: #f4f5f7; display: flex; flex-direction: column; overflow: hidden">

      <span style="font-size: 16px; font-weight: 600">支援会議メモ</span>
      <span style="font-size: 12px; color: #5b6472">11/5（水） 15:00 ・ 施設の会議室</span>
    </div>
  </div>
  <div style="flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding: 10px 16px">
    <section style="background: #ffffff; border: 1px solid #c7cbd1; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 600; color: #5b6472">参加した人</span>
      <div style="display: flex; flex-wrap: wrap; gap: 6px"><button style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 2px solid #1d4ed8; background: #e8eefc; color: #1e40af; font-size: 13px; font-weight: 600">母</button><button style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 2px solid #1d4ed8; background: #e8eefc; color: #1e40af; font-size: 13px; font-weight: 600">山田（サビ管）</button><button style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 2px solid #1d4ed8; background: #e8eefc; color: #1e40af; font-size: 13px; font-weight: 600">鈴木先生</button><button style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 2px solid #1d4ed8; background: #e8eefc; color: #1e40af; font-size: 13px; font-weight: 600">田中（相談員）</button><button style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #c7cbd1; background: #ffffff; color: #3b4452; font-size: 13px">父</button></div>
    </section>
    <section style="background: #ffffff; border: 1px solid #c7cbd1; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between"><span style="font-size: 12px; font-weight: 600; color: #5b6472">見たグラフ（会議の日の時点で保存）</span><span style="font-size: 11px; color: #5b6472">10/8〜11/4</span></div>
      <span style="font-size: 13px; font-weight: 600">頭たたき と 休憩カードを渡す</span>
      <svg viewBox="0 0 358 170" width="334" height="159" role="img" aria-label="頻度の折れ線グラフ。横軸は10月8日の週から10月29日の週まで、縦軸は1時間あたりの回数で0から8。頭たたきは約6回から約2.4回へ減少、休憩カードは約0回から約4回へ増加" style="display: block; margin: 4px auto 0"><text x="2" y="10" font-size="10" font-weight="600" fill="#3b4452">1週間の平均（回/時）</text><line x1="40" y1="118.0" x2="296" y2="118.0" stroke="#eceef1"/><text x="35" y="121.5" font-size="10" text-anchor="end" fill="#3b4452">0</text><line x1="40" y1="94.0" x2="296" y2="94.0" stroke="#eceef1"/><text x="35" y="97.5" font-size="10" text-anchor="end" fill="#3b4452">2</text><line x1="40" y1="70.0" x2="296" y2="70.0" stroke="#eceef1"/><text x="35" y="73.5" font-size="10" text-anchor="end" fill="#3b4452">4</text><line x1="40" y1="46.0" x2="296" y2="46.0" stroke="#eceef1"/><text x="35" y="49.5" font-size="10" text-anchor="end" fill="#3b4452">6</text><line x1="40" y1="22.0" x2="296" y2="22.0" stroke="#eceef1"/><text x="35" y="25.5" font-size="10" text-anchor="end" fill="#3b4452">8</text><line x1="40" y1="22" x2="40" y2="118" stroke="#8a94a3"/><line x1="40" y1="118" x2="296" y2="118" stroke="#8a94a3"/><line x1="40.0" y1="118" x2="40.0" y2="122" stroke="#8a94a3"/><text x="40.0" y="133" font-size="9.5" text-anchor="middle" fill="#3b4452">10/8〜</text><line x1="125.3" y1="118" x2="125.3" y2="122" stroke="#8a94a3"/><text x="125.3" y="133" font-size="9.5" text-anchor="middle" fill="#3b4452">10/15〜</text><line x1="210.7" y1="118" x2="210.7" y2="122" stroke="#8a94a3"/><text x="210.7" y="133" font-size="9.5" text-anchor="middle" fill="#3b4452">10/22〜</text><line x1="296.0" y1="118" x2="296.0" y2="122" stroke="#8a94a3"/><text x="296.0" y="133" font-size="9.5" text-anchor="middle" fill="#3b4452">10/29〜</text><text x="296" y="166" font-size="10" font-weight="600" text-anchor="end" fill="#3b4452">週（1週間ごと）</text><line x1="40" y1="94.0" x2="296" y2="94.0" stroke="#1f2328" stroke-dasharray="2 3"/><text x="44" y="91.0" font-size="9" fill="#1f2328">達成基準 2回/時</text><line x1="168.0" y1="16" x2="168.0" y2="118" stroke="#5b6472" stroke-width="1.5" stroke-dasharray="5 4"/><text x="164.0" y="24" font-size="9" text-anchor="end" fill="#5b6472">ベースライン</text><text x="172.0" y="24" font-size="9" fill="#5b6472">支援開始</text><polyline points="40.0,44.8 125.3,49.6" fill="none" stroke="#c2410c" stroke-width="2.5"/><polyline points="210.7,79.6 296.0,89.2" fill="none" stroke="#c2410c" stroke-width="2.5"/><circle cx="40.0" cy="44.8" r="3" fill="#c2410c"/><circle cx="125.3" cy="49.6" r="3" fill="#c2410c"/><circle cx="210.7" cy="79.6" r="3" fill="#c2410c"/><circle cx="296.0" cy="89.2" r="3" fill="#c2410c"/><text x="301" y="98.7" font-size="10" font-weight="700" fill="#c2410c">頭たたき</text><text x="301" y="110.2" font-size="9" fill="#c2410c">2.4回/時</text><polyline points="40.0,115.6 125.3,113.2" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="6 3"/><polyline points="210.7,86.8 296.0,68.8" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="6 3"/><rect x="37.0" y="112.6" width="6" height="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/><rect x="122.3" y="110.2" width="6" height="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/><rect x="207.7" y="83.8" width="6" height="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/><rect x="293.0" y="65.8" width="6" height="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/><text x="301" y="66.3" font-size="10" font-weight="700" fill="#1d4ed8">休憩カード</text><text x="301" y="77.8" font-size="9" fill="#1d4ed8">4.1回/時</text></svg>
    </section>
    <section style="background: #ffffff; border: 1px solid #c7cbd1; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 600; color: #5b6472">確かめた成果（できたこと）</span>
      <span style="font-size: 13px; line-height: 1.5">休憩カードが3週続けて増えた。頭たたきは支援開始前の半分ほどに減った。</span>
      <span style="font-size: 12px; font-weight: 600; color: #5b6472">決めたこと</span>
      <textarea style="width: 100%; box-sizing: border-box; min-height: 52px; padding: 8px 10px; border: 1px solid #c7cbd1; border-radius: 8px; font-size: 13px; line-height: 1.5; color: #1f2328; background: #ffffff; resize: none">午前の個別課題の量を2つ減らし、終わりの合図を写真カードで見せる。学校でも同じカードを使う。</textarea>
      <span style="font-size: 12px; font-weight: 600; color: #5b6472">次の見直し日</span>
      <input type="text" value="12/3（水）" style="width: 100%; box-sizing: border-box; min-width: 0; min-height: 44px; padding: 0 12px; border: 1px solid #c7cbd1; border-radius: 8px; font-size: 14px; color: #1f2328; background: #ffffff">
    </section>
    <section style="background: #ffffff; border: 1px solid #c7cbd1; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 600; color: #5b6472">コメント（2）</span>
      <div style="font-size: 13px; line-height: 1.5"><strong>鈴木先生</strong> 学校の写真カードを家庭用にもう1組作ります。</div>
      <div style="font-size: 13px; line-height: 1.5"><strong>母</strong> @鈴木先生 ありがとうございます。家でも使ってみます。</div>
      <input type="text" placeholder="コメントを書く（@ で相手を指定）" style="width: 100%; box-sizing: border-box; min-width: 0; min-height: 44px; padding: 0 12px; border: 1px solid #c7cbd1; border-radius: 8px; font-size: 14px; color: #1f2328; background: #ffffff">
    </section>
  </div>
  <div style="display: flex; flex-direction: column; gap: 6px; padding: 10px 16px 16px; background: #ffffff; border-top: 1px solid #d9dce1">
      <button style="min-height: 48px; border-radius: 10px; border: none; background: #1d4ed8; color: #ffffff; font-size: 15px; font-weight: 600">保存して参加者に知らせる</button>
  </div>
</div>
