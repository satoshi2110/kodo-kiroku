<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ログイン</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;color:#1f2328}
a{color:#1d4ed8}a:hover{color:#1e3a8a}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 1000px; box-sizing: border-box; background: #f4f5f7; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 28px 16px 12px; background: #ffffff; border-bottom: 1px solid #d9dce1; display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 20px; font-weight: 700">行動の記録</span>
    <span style="font-size: 12px; color: #5b6472; line-height: 1.5">招待された人だけが使えます。一般には公開していません。</span>
  </div>
  <div style="flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px">
    <section style="background: #ffffff; border: 1px solid #c7cbd1; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 600; color: #5b6472">ログイン</span>
      <input type="email" placeholder="メールアドレス" value="mother@example.com" style="min-height: 44px; padding: 0 12px; border: 1px solid #c7cbd1; border-radius: 8px; font-size: 15px; color: #1f2328; background: #ffffff">
      <input type="password" placeholder="パスワード（6文字以上）" value="●●●●●●" style="min-height: 44px; padding: 0 12px; border: 1px solid #c7cbd1; border-radius: 8px; font-size: 15px; color: #1f2328; background: #ffffff">
      <span style="font-size: 12px; font-weight: 600; color: #5b6472; margin-top: 4px">この端末は</span>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
        <button style="min-height: 40px; padding: 0 12px; border-radius: 10px; border: 2px solid #1d4ed8; background: #e8eefc; color: #1e40af; font-size: 13px; font-weight: 600; text-align: left">自分専用<br><span style="font-size: 11px; font-weight: 400">ロックはスマホに任せる</span></button>
        <button style="min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid #c7cbd1; background: #ffffff; color: #3b4452; font-size: 13px; text-align: left">共用（施設など）<br><span style="font-size: 11px">10分でロック・PIN で交代</span></button>
      </div>
      <button style="min-height: 48px; border-radius: 10px; border: none; background: #1d4ed8; color: #ffffff; font-size: 15px; font-weight: 600">ログイン</button>
      <button style="min-height: 44px; border-radius: 10px; border: 1px solid #1d4ed8; background: #ffffff; color: #1d4ed8; font-size: 14px; font-weight: 600">顔・指紋（パスキー）でログイン</button>
      <a href="#" style="font-size: 13px; text-align: center; padding: 6px 0">パスワードを忘れた</a>
      <span style="font-size: 12px; color: #5b6472; line-height: 1.5">5回続けて間違えると15分ログインできません。再設定のリンクは登録したメールに届きます（30分有効）。</span>
    </section>

    <section style="background: #ffffff; border: 1px solid #c7cbd1; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 600; color: #5b6472">招待リンクから開いたとき</span>
      <div style="padding: 10px 12px; background: #e8eefc; border-radius: 10px; font-size: 13px; line-height: 1.5; color: #1e40af">「Aさん」のチームに <strong>支援者</strong> として招待されています（招待した人: 母 ・ 11/7 9:00 まで有効）。</div>
      <button style="min-height: 48px; border-radius: 10px; border: none; background: #1d4ed8; color: #ffffff; font-size: 15px; font-weight: 600">参加する（アカウントを作る）</button>
      <span style="font-size: 12px; color: #5b6472; line-height: 1.5">参加したあと、管理者か支援リーダーが承認すると記録が見られます。</span>
    </section>

    <section style="background: #ffffff; border: 1px solid #c7cbd1; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 600; color: #5b6472">新しいチームを作る（保護者の方）</span>
      <input type="text" placeholder="開始コード（運営からお渡ししたもの）" value="KZ7P-4M2Q" style="min-height: 44px; padding: 0 12px; border: 1px solid #c7cbd1; border-radius: 8px; font-size: 15px; color: #1f2328; background: #ffffff; letter-spacing: 2px">
      <button style="min-height: 44px; border-radius: 10px; border: 1px solid #1d4ed8; background: #ffffff; color: #1d4ed8; font-size: 14px; font-weight: 600">コードを確かめて始める</button>
      <span style="font-size: 12px; color: #5b6472; line-height: 1.5">開始コードは1つで1チーム（対象者1人）。発行から30日で使えなくなります。</span>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
