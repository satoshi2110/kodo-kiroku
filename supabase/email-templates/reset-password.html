<!-- 自分の SMTP をつないだあとで使う（標準のメール送信では、ひな形を変えられない）。
     Supabase: Authentication → Emails → Templates → Reset Password
     件名: 【行動の記録】パスワードの再設定 -->
<h2>パスワードの再設定</h2>
<p>「行動の記録」で、パスワードを決め直す申し込みがありました。</p>
<p>下のリンクを開いて、新しいパスワードを決めてください。リンクは 30分のあいだ、1回だけ使えます。</p>
<p><a href="{{ .ConfirmationURL }}">新しいパスワードを決める</a></p>
<p>心当たりがないときは、このメールは捨ててください。パスワードは変わりません。</p>
